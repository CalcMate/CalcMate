# placeholder_schemas.yaml — 계산기별 article_content 플레이스홀더 화이트리스트
# 구조: {slug}.{variable}: {expose, formatter, fallback}
# expose: true = 사용자 화면 노출 허용 / false = 민감정보, 절대 노출 금지
# formatter: currency | number | date | text
# fallback: 값 미입력(초기 화면) 시 표시할 예시 문구
#
# 빌드 규칙 (3분기):
#   변수 존재 + 값 있음 → 값 치환
#   변수 존재 + 값 없음 → fallback 표시
#   변수 미정의(스키마 없음) → 빌드 오류 로그 + PLACEHOLDER_ERROR 마킹
#   변수 expose:false → 빌드 오류 (민감정보 노출 차단)

weekly-holiday-allowance:
  hourly_wage:
    expose: true
    formatter: currency
    fallback: "시급"
  weekly_hours:
    expose: true
    formatter: number
    fallback: "주당 근로시간"
  weekly_holiday_pay:
    expose: true
    formatter: currency
    fallback: "예상 주휴수당"

