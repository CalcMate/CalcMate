# legal_basis.draft.yaml — 계산기별 법적 근거 초안 (7/7종)
#
# ⚠️ DRAFT — 코드에서 로드하지 않는다(docs/ 위치). B-2 지시서에서 검증 완료 후
#    config/ 등으로 옮겨 writer에 주입한다.
# ⚠️ 출처: 사람 웹검색(법제처 국가법령정보센터/생활법령정보/국세청 등) 기반 초안.
#    법률 전문가 검토 아님 — 코드 반영 전 law.go.kr 원문 대조 등 사람 최종 검증 필수.
#
# 키 = 계산기 slug(코드베이스 실제 값과 대조 완료, 2026-07-05). name = 사람 가독용.
# 각 항목의 law/article이 계산기 실제 수식·입력과 어긋나지 않는지 코드 관점 검토 완료.

weekly-holiday-allowance:
  name: 주휴수당 계산기
  law: 근로기준법
  article: 제55조
  related_articles:
    - 제18조제3항          # 주 15시간 미만 근로자 적용 제외
  authority: 고용노동부
  writer_note: >
    근로기준법 제55조에 따라 사용자는 근로자에게 1주 평균 1회 이상의 유급휴일을
    보장해야 하며, 이 유급휴일에 지급되는 임금이 주휴수당이다. 4주 평균 주
    15시간 미만 근로자는 제18조제3항에 의해 적용 제외되므로 이 예외를 함께 언급한다.
  blocklist: []
  # 코드정합: input(hourly_wage, weekly_hours) / formula hourly_wage*(weekly_hours/40*8) — 정합.

severance-pay:
  name: 퇴직금 계산기
  law: 근로자퇴직급여 보장법
  article: 제8조
  related_articles: []
  authority: 고용노동부
  writer_note: >
    근로자퇴직급여 보장법 제8조에 따라 사용자는 계속근로기간 1년에 대해 30일분
    이상의 평균임금을 퇴직금으로 지급해야 한다. 2005년 이 법 제정 이후
    근로기준법 제34조는 이관·삭제되었으므로 절대 인용하지 않는다.
  blocklist:
    - 근로기준법 제34조
  # 코드정합: input(avg_monthly_wage, start_date, end_date) / formula avg_monthly_wage*(total_days/365)
  #          — '1년당 30일분 평균임금'과 개념 정합.

annual-leave-allowance:
  name: 연차수당 계산기
  law: 근로기준법
  article: 제60조
  related_articles:
    - 제61조               # 연차 사용 촉진 — 적법 시행 시 수당 지급의무 면제
  authority: 고용노동부
  writer_note: >
    근로기준법 제60조에 따라 1년간 80% 이상 출근한 근로자에게 15일의 유급휴가가
    발생하며, 미사용 시 연차수당으로 정산된다. 단, 제61조에 따른 연차 사용
    촉진제도가 적법하게 시행된 경우 수당 지급의무가 면제될 수 있으므로 이 예외를
    FAQ 등에 함께 언급한다.
  blocklist: []
  # 코드정합: input(daily_wage, unused_days) / formula daily_wage*unused_days — 미사용일수 정산 정합.

unemployment-benefit:
  name: 실업급여 계산기
  law: 고용보험법
  article: 제40조
  related_articles:
    - 제41조               # 피보험단위기간
    - 제58조               # 수급자격 제한 사유
  authority: 고용노동부
  writer_note: >
    고용보험법 제40조에 따라 구직급여를 받으려면 이직일 이전 18개월간
    피보험단위기간이 180일 이상이어야 하며, 이직사유가 제58조의 수급자격 제한
    사유(자발적 이직, 중대 귀책사유 해고 등)에 해당하지 않아야 한다. 요건이
    다층적이므로 임의로 단순화하거나 단정적으로 서술하지 않는다.
  blocklist: []
  # 복합 요건형(기준서 §4) — 조항만으로 부족할 수 있음(B-2 이후 전용처리 후보).
  # 코드정합: input(avg_daily_wage, age, employment_months) / daily_benefit=avg_daily_wage*0.6.
  #          요건(180일·수급자격)은 계산기가 산출하지 않고 급여액만 계산 — note는 글 맥락용.

four-insurances:
  name: 4대보험 계산기
  law: 국민연금법·국민건강보험법·고용보험법·산업재해보상보험법 (복합)
  article: null             # 4개 법령 각각의 가입의무 조항이 다름 — related_articles 참조
  related_articles:
    - "국민연금법 제8조(가입대상)"
    - "국민건강보험법 제6조제2항"
    - "고용보험법 제8조"
    - "산업재해보상보험법 제8조"
  authority: 보건복지부(국민연금·건강보험) / 고용노동부(고용·산재보험)
  writer_note: >
    4대보험은 국민연금법 제8조, 국민건강보험법 제6조제2항, 고용보험법 제8조,
    산업재해보상보험법 제8조에 따라 근로자를 사용하는 모든 사업장이 의무 가입해야
    한다. 4개 법령을 개별 인용하기보다 이 문장 하나로 압축해서 기준서 §6
    "법적 근거 1회 이상" 요건을 충족한다.
  blocklist: []
  # ⚠️ 코드관찰(사람 검증 권장): 계산기 output은 국민연금/건강/고용 3종 + total 만 산출하고
  #    산재보험은 없음(산재료는 전액 사업주 부담 → 근로자 공제분 아님. 설계상 맞음).
  #    법적근거는 '가입의무'로 4법 병기(맞음)이나, 본문에서 산재가 '근로자 공제'된다는
  #    뉘앙스가 되지 않도록 주의(가입의무 ≠ 근로자 공제).

연말정산_환급액_계산기:
  name: 연말정산 환급액 계산기
  law: 소득세법
  article: 제137조
  related_articles:
    - 제134조               # 근로소득 원천징수시기·방법(매월분)
    - 제140조               # 근로소득자 소득·세액공제 신고
  authority: 국세청
  writer_note: >
    소득세법 제137조(근로소득세액의 연말정산)에 따라 원천징수의무자는 다음 연도
    2월분 근로소득(또는 퇴직자의 퇴직월 근로소득) 지급 시 1년간의 근로소득에
    소득·세액공제를 반영해 최종 소득세를 정산한다. 매월 원천징수(제134조)는 잠정
    세액이며, 연말정산으로 과부족을 정산한다.
  blocklist: []
  # 검증 근거: law.go.kr 조문, 국세청 안내 — 웹검색 1차 확인. 사람 최종 검증 필요.
  # 코드정합: input(total_income, deductions) / formula total_income-deductions — 단순 추정치. 정합.

육아휴직_급여_계산기:
  name: 육아휴직 급여 계산기
  law: 고용보험법
  article: 제70조
  related_articles:
    - 제41조               # 피보험단위기간 180일 이상 요건
    - 제73조               # 육아휴직 중 취업 시 지급 제한 사유
  authority: 고용노동부
  writer_note: >
    고용보험법 제70조에 따라 30일 이상 육아휴직을 부여받고 피보험단위기간이
    180일 이상인 피보험자에게 육아휴직 급여가 지급된다. 지급액 상한·하한 등 구체
    금액은 고용보험법 시행령에서 정하며 연도별로 변경될 수 있으므로 특정 연도 금액을
    단정적으로 서술하지 않는다.
  blocklist: []
  # caveat: 제70조제2항(급여 신청기한) 관련 대법원 전원합의체 판결(2021, 강행규정 확정)이 있음
  #         — "신청기한 초과 시 지급 거부"를 단정적으로 쓸 경우 최신 판례 취지와 어긋나지
  #         않는지 사람 검증 시 확인 권장.
  # 코드정합: input(avg_monthly_wage, leave_months, government_support_%, company_%) /
  #          formula (avg_monthly_wage*leave_months)*((gov%+company%)/100) — %기반이라 특정연도 금액 미하드코딩. 정합.
