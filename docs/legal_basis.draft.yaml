# 키 = 계산기 slug(코드베이스 실제 값과 대조 완료). name = 사람 가독용.
# writer(_write_article)가 calc.slug로 조회해 "그대로 인용" 지시로 주입한다(B-2).
# blocklist(조항 금지)는 AI_STYLE_BLOCKLIST(문체 금지)와 별개 목록이다.

schema_version: 2   # v1=legal_basis 전용 → v2=calculator_registry(Phase A). 기존 legal 필드 무변경,
                    # identity/compute/labels/meta/content/relations 추가(compute/relations는 읽기전용 미러).

