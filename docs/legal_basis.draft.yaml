  name: 주휴수당 계산기
  law: 근로기준법
  article: 제55조
  related_articles:
    - 제18조제3항
  authority: 고용노동부
  confidence: high
  last_verified: 2026-07-05
  verification_source: [law.go.kr, easylaw.go.kr]
  writer_note: >
    근로기준법 제55조에 따라 사용자는 근로자에게 1주 평균 1회 이상의 유급휴일을
    보장해야 하며, 이 유급휴일에 지급되는 임금이 주휴수당이다. 4주 평균 주
    15시간 미만 근로자는 제18조제3항에 의해 적용 제외되므로 이 예외를 함께 언급한다.
