# 검색 기반으로 1차 검증 완료. 운영 중 법령·시행령·판례·행정해석 변경이 확인되면
# 해당 항목만 업데이트한다. (사람에 의한 law.go.kr 전면 원문대조는 정보성 콘텐츠
# 성격상 생략하기로 결정 — 2026-07-05)
