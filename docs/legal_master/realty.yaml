# legal_master/realty.yaml — 법령 조항 엔티티(SSOT). STEP 16(신규 계산기 생성 라인 E2E 검증)에서 신설.
real_estate_agent_act_rule_20:
  law: 공인중개사법 시행규칙
  article: 제20조
  related_articles:
  - 별표1
  authority: 국토교통부
  confidence: high
  last_verified: 2026-08-26
  verification_source:
  - law.go.kr
  - easylaw.go.kr
  writer_note: '공인중개사법 시행규칙 제20조 및 별표1에 따라 주택 매매·교환은 거래금액 구간별로 0.4%~0.7%(5천만원 미만
    0.6%·한도25만원, 5천만원~2억원 미만 0.5%·한도80만원, 2억원~9억원 미만 0.4%, 9억원~12억원 미만 0.5%, 12억~15억원
    미만 0.6%, 15억원 이상 0.7%)의 상한요율이 적용되며, 주택 임대차(전세·월세)는 0.3%~0.6%(5천만원 미만 0.5%·한도20만원,
    5천만원~1억원 미만 0.4%·한도30만원, 1억~6억원 미만 0.3%, 6억~12억원 미만 0.4%, 12억~15억원 미만 0.5%, 15억원
    이상 0.6%)가 적용된다. 이는 법정 "상한요율"이며 실제 수수료는 공인중개사와 협의로 그 이내에서 결정된다. "무조건 상한요율이
    적용된다"는 서술은 정확하지 않으므로 반드시 "상한"이라는 표현을 유지한다. 오피스텔(전용 85㎡ 이하 등 요건 충족 시 0.5%)·토지·상가
    등 주택 외 부동산은 이 요율표와 다르며(0.9% 이내 협의), 이 계산기 범위 밖이다.

    '
  reviewer_expectation:
  - 법령명(공인중개사법 시행규칙) 및 조항(제20조) 언급
  - 상한요율이라는 표현 사용(확정요율이 아님을 명시)
  - 5천만원 미만/그 다음 구간의 정액 한도액 존재 언급
  forbidden_articles: []
  forbidden_phrases:
  - 무조건 상한요율이 적용됩니다
  - 협의 없이 요율표대로 지급해야 합니다
  needs_human_legal: false
  calculation_flow:
  - "주택 매매·교환: 거래금액 구간별 0.4~0.7% 상한요율(5천만원 미만/5천만원~2억원 구간은 정액 한도액 적용)"
  - "주택 임대차(전세·월세): 거래금액 구간별 0.3~0.6% 상한요율(5천만원 미만/5천만원~1억원 구간은 정액 한도액 적용)"
  - "중개보수 = min(거래금액 × 상한요율, 한도액) — 한도액이 있는 구간만 적용, 나머지 구간은 요율만 적용"
  - "월세는 거래금액 = 보증금 + (월세×100), 단 합산액 5천만원 미만이면 보증금 + (월세×70)으로 환산 후 임대차 요율표 적용(이 계산기는 환산된 금액을 직접 입력받는 방식으로 범위를 한정)"
