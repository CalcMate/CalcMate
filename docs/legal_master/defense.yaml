# docs/legal_master/defense.yaml
# Legal Master — 병역 관련 법령 엔티티
# 생성일: 2026-08-15 (군인전역일 계산기 Tier2-B 구현)

military_service_act_18:
  law: 병역법
  article: 제18조
  related_articles:
    - 제19조  # 복무기간 단축 위임 — 실제 18/20/21개월은 이 조항 위임에 따른 국방부 고시
  authority: 국방부 / 병무청
  confidence: medium
  last_verified: "2026-08-15"
  verification_source: "법제처 국가법령정보센터 (law.go.kr)"
  writer_note: >
    제18조 제2항 법문상 복무기간(육군·해병대 2년, 해군 2년2개월, 공군 2년3개월)은
    제19조 위임에 의한 국방부장관 고시로 단축 운영 중(2026년 기준: 육군·해병대 18개월, 해군 20개월, 공군 21개월).
    법문 기간과 실제 기간이 다르며, 고시 변경만으로 기간 조정 가능 → confidence=MEDIUM.
    전역일 계산식("입영일+N개월-1일")은 민간 관행 계산식으로 병무청 공식 문서에 명시 없음.
  reviewer_expectation: >
    국방부 고시(복무기간 단축) 원문 확인 필요.
    병무청 공식 전역일 계산 방법 문서 존재 시 HIGH 상향 검토.
    복무기간 변경 고시 발령 시 계산기 DUTY_MONTHS 상수 업데이트 필요.
  forbidden_articles:
    - 제26조  # 사회복무요원 소집 절차만 규정 — 현역병 복무기간과 무관
  forbidden_phrases:
    - "병무청 공식 산식"
    - "공식 계산법"
    - "법령 기준 전역일"
  needs_human_legal: true
  calculation_flow:
    - "입력: 입영일(date), 군별(army|marine|navy|air_force)"
    - "복무기간 조회: 군별 현행 기간(국방부 고시 기준)"
    - "전역예정일 = 입영일 + N개월 (민법 제160조 준용 — 말일 처리 포함)"
    - "전역일 = 전역예정일 - 1일 (관행 계산식, 병무청 공식 미확인)"
    - "출력: 예상 전역일, 남은 일수, 복무 진행률"

military_service_act_30:
  law: 병역법
  article: 제30조
  related_articles:
    - 소집업무규정 별표5  # 사회복무요원 복무기간 단축 행정규칙 — 21개월 근거
  authority: 병무청
  confidence: medium
  last_verified: "2026-08-15"
  verification_source: "찾기쉬운 생활법령정보 (easylaw.go.kr), 법제처 국가법령정보센터"
  writer_note: >
    제30조 제1항 법문상 복무기간은 2년2개월(26개월)이나,
    '사회복무요원 소집업무 규정 별표5 복무기간 단축 시행계획'(2018.10.1 시행)에 의해
    실제 21개월로 단축 운영 중. 행정규칙(훈령) 의존으로 변경 가능 → confidence=MEDIUM.
    주의: 제26조는 소집 절차만 규정하며 복무기간과 무관 — 절대 인용 금지.
  reviewer_expectation: >
    소집업무규정 별표5 원문 확인 필요.
    병무청 사회복무요원 복무기간 공식 고시 문서 확인 시 HIGH 상향 검토.
    복무기간 변경 시 계산기 DUTY_MONTHS["social_service"] 업데이트 필요.
  forbidden_articles:
    - 제26조  # 소집 절차만 규정 — 복무기간 근거 아님
    - 제18조  # 현역병 조항 — 사회복무요원에 미적용
  forbidden_phrases:
    - "병무청 공식 산식"
    - "공식 계산법"
    - "법령 기준 전역일"
    - "제26조에 따른 복무기간"
  needs_human_legal: true
  calculation_flow:
    - "입력: 입영일(date), 군별=social_service"
    - "복무기간: 21개월 (소집업무규정 별표5 기준)"
    - "전역예정일 = 소집일 + 21개월 (민법 제160조 준용 — 말일 처리 포함)"
    - "소집해제일 = 전역예정일 - 1일 (관행 계산식, 병무청 공식 미확인)"
    - "출력: 예상 소집해제일, 남은 일수, 복무 진행률"
