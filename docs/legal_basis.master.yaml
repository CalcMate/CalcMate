  forbidden_phrases: []
  # --- registry v2 (Phase A: 읽기전용 미러, 아직 참조 코드 없음) ---
  slug: weekly-holiday-allowance
  category: 노무/급여
  emoji: "💰"
  card_label: 주휴수당 계산기        # 관련카드 UI 표시명(짧은 문구). 기본=name, 다르면 override
  compute_type: single
  date_fields: []
  validation_mode: formula
  field_labels: {}
  difficulty: simple
  difficulty_status: provisional
  needs_human_legal: false
  content:
    evergreen: true
    update_cycle: null
    content_caveat: null
  related_slugs: [severance-pay, annual-leave-allowance, unemployment-benefit, four-insurances, 연말정산_환급액_계산기, 육아휴직_급여_계산기]
  # 코드정합: input(hourly_wage, weekly_hours) / formula hourly_wage*(weekly_hours/40*8).
  # compute_rules: _compute_js()가 읽어 JS 검증 코드를 자동 주입한다.
  compute_rules:
    min_weekly_hours: 15                          # 미만 시 0원 + notices 안내
    min_weekly_hours_law: 근로기준법 제18조제3항   # notice 인용 조항
    min_wage: 10030                               # 미만 시 경고 notices (계산 차단 안 함)
    min_wage_year: 2026
    min_wage_field: hourly_wage                   # 최저임금 비교 대상 입력 필드
    positive_inputs: [hourly_wage, weekly_hours]  # 0 이하 시 null 반환(입력 오류)

severance-pay:
  name: 퇴직금 계산기
  law: 근로자퇴직급여 보장법
  article: 제8조
  related_articles: []
  authority: 고용노동부
  confidence: high
  last_verified: 2026-07-05
  verification_source: [law.go.kr, easylaw.go.kr]
  writer_note: >
    근로자퇴직급여 보장법 제8조에 따라 사용자는 계속근로기간 1년에 대해 30일분
    이상의 평균임금을 퇴직금으로 지급해야 한다. 2005년 이 법 제정 이후
    근로기준법 제34조는 이관·삭제되었으므로 절대 인용하지 않는다.

    [평균임금 산정 — 반드시 정확히 서술]
    평균임금 = 퇴직 사유 발생일 이전 3개월 동안 지급된 임금 총액 ÷ 3개월 총일수
    (근로기준법 제2조제1항제6호).
    포함 항목: 기본급, 연장·야간·휴일근로 가산수당, 통상 지급 상여금(연간총액의 1/12).
    제외 항목: 임시로 지급된 수당, 1회성 급부 (근로기준법 시행령 제2조).
    "초과근무수당이나 상여금은 포함하지 않는다"는 서술은 사실과 정반대이므로 절대 쓰지 않는다.

    [출력 형식 필수]
    1. 본문에 "근로자퇴직급여 보장법 제8조" 문자열을 정확하게 최소 1회 포함한다.
    2. 퇴직금의 법적 근거는 오직 이 조항이다. "근로기준법 제34조"는 폐지되어
    존재하지 않으므로 본문에 절대 언급하지 않는다. 조항을 쓸 때 법령명이
    "근로기준법"이 아니라 "근로자퇴직급여 보장법"임을 반드시 확인한다.
  reviewer_expectation:
    - 법령명(근로자퇴직급여 보장법) 및 조항(제8조) 언급
    - 근로기준법 제34조 언급 없음
    - 초과근무수당·상여금 포함 여부 서술이 있으면 "포함"으로 명시
  forbidden_articles: [근로기준법 제34조]
  forbidden_phrases: []
  # --- registry v2 (Phase A: 읽기전용 미러) ---
  slug: severance-pay
  category: 노무/급여
  emoji: "💼"
  card_label: 퇴직금 계산기
  compute_type: date_based
  date_fields: [start_date, end_date]
  validation_mode: skip
  field_labels: {}
  difficulty: date_based
  difficulty_status: provisional
  needs_human_legal: false
  content:
    evergreen: true
    update_cycle: null
    content_caveat: null
  related_slugs: [weekly-holiday-allowance, annual-leave-allowance, unemployment-benefit, four-insurances, 연말정산_환급액_계산기, 육아휴직_급여_계산기]
  # 코드정합: input(avg_monthly_wage, start_date, end_date) / formula avg_monthly_wage*(total_days/365).

