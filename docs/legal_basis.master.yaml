unemployment-benefit:
  name: 실업급여 계산기
  law: 고용보험법
  article: 제40조
  related_articles: [제41조, 제58조]
  authority: 고용노동부
  confidence: medium
  last_verified: 2026-07-05
  verification_source: [law.go.kr, easylaw.go.kr]
  writer_note: >
    고용보험법 제40조 및 제41조에 따른 구직급여 수급요건에는 피보험단위기간
    180일 이상, 이직사유 제한(제58조) 등 여러 조건이 복합적으로 포함된다.
    단일 조문이나 단일 요건만으로 수급 여부가 결정된다고 단정하지 않는다.
    "수급 가능합니다"처럼 확정적으로 쓰지 말고 "수급 가능성이 있습니다",
    "최종 수급 여부는 고용센터 심사 결과에 따라 달라질 수 있습니다"처럼 표현한다.

    [출력 형식 필수]
    1. 본문에 "고용보험법 제40조" 문자열을 정확하게 최소 1회 포함한다.
  reviewer_expectation:
    - 법령명(고용보험법) 언급
    - 소관기관(고용노동부) 언급
    - 요건이 단일하지 않고 복합적임을 명시
    - 수급 여부를 확정적으로 표현하지 않음(가능성/심사결과 표현 사용)
  forbidden_articles: []
  # 개인의 수급 여부를 직접 단정하는 표현만 금지(개인 단정형).
  # "지급됩니다"는 제도 설명 문장("최대 300일 동안 지급됩니다" 등)에서 자연스러워 제외 —
  # 문맥 구분 없는 금지로 G8 오탐이 발생했기 때문(수정 근거).
  # Phase C-1(2026-07-12): "받을 수 있습니다"/"받게 됩니다"는 제도·요건 설명 문맥에서도
  # 자연스러운 서술이라 writer가 반복 위반→G8 오탐. 개인 확정 단정("수급 대상입니다")만 유지.
  forbidden_phrases:
    - 수급 대상입니다
  # --- registry v2 (Phase A: 읽기전용 미러) ---
  slug: unemployment-benefit
  category: 고용/보험
  emoji: "📋"
  card_label: 실업급여 계산기
  compute_type: single
  date_fields: []
  validation_mode: formula
  field_labels: {}
  difficulty: complex
  difficulty_status: provisional
  needs_human_legal: false
  content:
    evergreen: true
    update_cycle: null
    content_caveat: null
  related_slugs: [weekly-holiday-allowance, severance-pay, annual-leave-allowance, four-insurances, 연말정산_환급액_계산기, 육아휴직_급여_계산기]
  # 코드정합: input(avg_daily_wage, age, employment_months) / daily_benefit=avg_daily_wage*0.6.
  # 요건(180일·수급자격)은 계산기가 산출하지 않고 급여액만 계산 — writer_note는 글 맥락용.
  benefit_amounts:
    # 구직급여 상한/하한 수치 — 매년 확인 필요 (연초에 갱신)
    daily_max: 66000          # 고용노동부 고시 (2019년 이후, 2025년 기준 — 매년 재확인)
    min_wage_hourly: 10030    # 최저임금 시간급 (2025년 기준, 2026년 미확인 — law.go.kr 접근 실패)
    # 하한 = min_wage_hourly × 8 × 0.8 (고용보험법 제46조 제2항)
  benefit_days_table:
    # 고용보험법 별표1 소정급여일수 (2019년 개정 이후 현행)
    # months_lo 이상 ~ months_hi 미만. months_hi: null = 상한 없음(Infinity)
    under_50:
      - {months_lo: 0,   months_hi: 12,  days: 120}
      - {months_lo: 12,  months_hi: 36,  days: 150}
      - {months_lo: 36,  months_hi: 60,  days: 180}
      - {months_lo: 60,  months_hi: 120, days: 210}
      - {months_lo: 120, months_hi: null, days: 240}
    age_50_plus:
      - {months_lo: 0,   months_hi: 12,  days: 120}
      - {months_lo: 12,  months_hi: 36,  days: 180}
      - {months_lo: 36,  months_hi: 60,  days: 210}
      - {months_lo: 60,  months_hi: 120, days: 240}
      - {months_lo: 120, months_hi: null, days: 270}

four-insurances:
  name: 4대보험 계산기
  law: 국민연금법·국민건강보험법·고용보험법·산업재해보상보험법 (복합)
  article: null
  related_articles:
    - "국민연금법 제8조(가입대상)"
    - "국민건강보험법 제6조제2항"
    - "고용보험법 제8조"
    - "산업재해보상보험법 제8조"
  authority: 보건복지부(국민연금·건강보험) / 고용노동부(고용·산재보험)
  confidence: high
  last_verified: 2026-07-05
  verification_source: [law.go.kr, easylaw.go.kr, mohw.go.kr]
  writer_note: >
    4대보험은 국민연금법 제8조, 국민건강보험법 제6조제2항, 고용보험법 제8조,
    산업재해보상보험법 제8조에 따라 근로자를 사용하는 모든 사업장이 의무
    가입해야 한다. 4개 법령을 개별 인용하기보다 이 문장 하나로 압축해서
    기준서 §6 "법적 근거 1회 이상" 요건을 충족한다. 단, 산재보험료는 가입
    의무와 별개로 원칙적으로 사업주가 전액 부담하므로, "4대보험 모두 근로자
    급여에서 공제된다"처럼 일반화하지 않는다 — 근로자 실공제 대상은 국민연금·
    건강보험·고용보험 3종이다.
  reviewer_expectation:
    - 4개 법령명 모두 언급 또는 요약 언급
    - 산재보험이 근로자 공제 대상이 아님을 구분
  forbidden_articles: []
  forbidden_phrases: []
  # --- registry v2 (Phase A: 읽기전용 미러) ---
  slug: four-insurances
  category: 고용/보험
  emoji: "🏢"
  card_label: 4대보험 계산기
  compute_type: dict
  date_fields: []
  validation_mode: formula
  field_labels: {}
  difficulty: multi_output
  difficulty_status: provisional
  needs_human_legal: false
  content:
    evergreen: false          # 요율(국민연금 4.5%/건강 3.545%/고용 0.9%)이 formula에 하드코딩 → 연 1회 갱신 필요
    update_cycle: yearly
    content_caveat: null
  related_slugs: [weekly-holiday-allowance, severance-pay, annual-leave-allowance, unemployment-benefit, 연말정산_환급액_계산기, 육아휴직_급여_계산기]
  # 결정: "관련 법령에 따라"식 단순화는 기각 — legal_basis 도입 취지와 배치, writer_note에 압축 지시 있음.
  # 코드정합: output은 국민연금/건강보험/장기요양/고용보험 4종+total(산재 없음, 설계상 맞음).
  insurance_rates:
    # 매년 확인 필요 — 국민연금: 7월 1일 조정 / 건강·장기요양: 1월 1일 조정
    np_rate:  0.045        # 국민연금 근로자 요율 4.5% (국민연금법 제88조)
    np_min:   390000       # 기준소득월액 하한 390,000원 (2024.7~2025.6 고시)
    np_max:   6170000      # 기준소득월액 상한 6,170,000원 (2024.7~2025.6 고시)
    hi_rate:  0.03545      # 건강보험 근로자 요율 3.545% (2025년, 총 7.09%)
    ltc_rate: 0.1296       # 장기요양보험 = 건강보험료 × 12.96% (2025년) ← 급여 아닌 건강보험료에 곱
    ei_rate:  0.009        # 고용보험 근로자 요율 0.9%
    reference_year: 2025

연말정산_환급액_계산기:
  name: 연말정산 환급액 계산기
  law: 소득세법
  article: 제137조
  related_articles: [제134조, 제140조]
  authority: 국세청
  confidence: medium
  last_verified: 2026-07-05
  verification_source: [law.go.kr, nts.go.kr]
  writer_note: >
    소득세법 제137조(근로소득세액의 연말정산)에 따라 원천징수의무자는 다음
    연도 2월분 근로소득(또는 퇴직자의 퇴직월 근로소득) 지급 시 1년간의
    근로소득에 소득·세액공제를 반영해 최종 소득세를 정산한다. 매월
    원천징수(제134조)는 잠정 세액이며, 연말정산으로 과부족을 정산한다.
    ⚠️ 본 계산 결과는 참고용 예상치이며, 실제 연말정산 결과는 국세청
    홈택스 및 회사 정산 결과와 다를 수 있다는 문구를 반드시 포함한다.
    "간이 추정"이라는 표현만으로 대체하지 않는다.

    [출력 형식 필수]
    1. 본문에 "소득세법 제137조" 문자열을 정확하게 최소 1회 포함한다.
    2. 프롬프트의 [계산 근거 데이터]에 제공된 공제 규칙(의료비/신용카드/연금저축/교육비/인적공제)을
    활용해, 서로 다른 공제 항목이 적용된 '질적으로 다른' 계산 예시를 정확히 2개 작성한다.
    (예: ① 부양가족+의료비 지출 케이스, ② 1인가구+연금저축 납입 케이스)
    3. 각 예시는 "예를 들어, ... = OOO원" 형식으로 구체 계산식과 결과 금액을 명시한다.
    4. "소득세법 제55조", "소득세법 제63조"는 본문에 언급하지 않는다.
  reviewer_expectation:
