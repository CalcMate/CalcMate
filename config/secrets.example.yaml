# config/secrets.example.yaml
# 이 파일을 복사해 config/secrets.yaml 을 만들고 실제 키를 입력하세요.
#   cp config/secrets.example.yaml config/secrets.yaml
# secrets.yaml 은 .gitignore 대상이므로 커밋되지 않습니다. (이 example 파일만 추적)
#
# ConfigLoader가 런타임에 config.yaml + secrets.yaml 을 병합합니다(secrets 우선).
# 키 이름은 기존 flat 키와 동일하게 유지해야 합니다.

# ── 런타임 비밀값 (flat) ──────────────────────────────────────────────
OPENAI_API_KEY: ""          # sk-proj-...
CLAUDE_API_KEY: ""          # sk-ant-...
GEMINI_API_KEY: ""          # AIza... 또는 AQ...
WORDPRESS_APP_PASSWORD: ""  # WordPress 앱 비밀번호 (xxxx xxxx xxxx ...)
TELEGRAM_BOT_TOKEN: ""      # @BotFather 발급 토큰 (선택)

# ── 사이트별 프로필 (site_repository.py 사용) ──────────────────────────
wordpress_profiles: {}      # { wp_프로필ID: {url, username, app_password} }
ai_keys: {}                 # { gemini_flash, gpt4o, claude_sonnet, claude_haiku }
