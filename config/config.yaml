# Content Sync Engine (WordPress 기준 → Google Sheets 동기화, Publish Scheduler와 별개 서비스)
#   run_sync.py 로 독립 기동. 매일 run_at(새벽, Publish 슬롯과 안 겹치는 시간)에 1회 실행.
#   full_scan_weekday(0=월) 요일에는 전체 스캔(full), 그 외 요일은 recent(최근 recent_days일).
CONTENT_SYNC:
  enabled: true
  run_at: '03:00'
  full_scan_weekday: 0
  recent_days: 30
  poll_seconds: 60
TELEGRAM_EVENTS:
  error: true
  budget: true
  daily_summary: true
  publish_request: true
  quality_critical_hold: true
